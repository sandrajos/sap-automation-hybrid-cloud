---
- name: Validate SAP server provisioning
  hosts: sap_servers
  gather_facts: false

  vars:
    project_root: "{{ playbook_dir }}/../.."
    sap_server_file: "{{ project_root }}/terraform/sap-server-01.txt"

  tasks:
    - name: Check simulated SAP server artifact
      ansible.builtin.stat:
        path: "{{ sap_server_file }}"
      register: sap_server

    - name: Fail when Terraform artifact is missing
      ansible.builtin.fail:
        msg: "SAP server artifact was not created by Terraform."
      when: not sap_server.stat.exists

    - name: Confirm SAP server provisioning
      ansible.builtin.debug:
        msg: "SAP server artifact is present and ready for validation."
